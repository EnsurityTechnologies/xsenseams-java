# AMS API host. This is not the browser page origin. The page origins are
# http://ui1.localhost:5173 and http://ui2.localhost:5173, and the Java server
# copies that Origin header onto the three FIDO start calls.
ams.base-url=https://host.ams4keys.local
ams.api-key=testfidokey

# Optional: tenant header if your deployment uses it. AMS normally selects the tenant from the host.
# ams.tenant-header-name=X-Tenant-ID
# ams.tenant-header-value=your-tenant-id

# Do not set ams.origin or ams.fido-server-config-id. AMS must select the FIDO
# configuration from the browser Origin alone. A configuration id is checked first
# and would skip Origin.

# Server port for this sample app
server.port=8080
