# XSenseAMS server (FIDO API). Use 127.0.0.1 to avoid IPv6 (::1) connection issues on some systems.
ams.base-url=https://dockerams.local:17700
ams.api-key=ASksaahsahsjfghgglLASLa@Aa99a9asaLLALsa

# Optional: tenant header if your deployment uses it. AMS normally selects the tenant from the host.
# ams.tenant-header-name=X-Tenant-ID
# ams.tenant-header-value=your-tenant-id

# Optional page origin sent to AMS when the incoming request has no Origin header.
# The demo UI is cross-origin, so the browser Origin is forwarded and this value is unused.
# ams.origin=http://localhost:5173

# FIDO server configuration id from Settings → FIDO Configuration.
# The Java app sends this on a start call that does not include its own id.
# Usernameless login has no username and no body, so set this when that ceremony
# must use a specific configuration. Leave blank to let AMS match Origin, then the primary configuration.
ams.fido-server-config-id=

# Server port for this sample app
server.port=8080
